# Secret scanning config. Pinned alongside the gitleaks version in
# .github/workflows/ci.yml so CI and a developer's machine cannot disagree
# about what counts as a leak.
#
# Everything gitleaks ships is kept; this file only narrows one rule, and it
# says why. R-SAN-02's principle applies here as much as it does to
# clang-tidy: a check narrowed without a written reason is a check nobody
# decided about.

[extend]
useDefault = true

# `generic-api-key` is the entropy-based catch-all: no vendor prefix to match
# on, so it fires on any longish high-entropy string. In `docs/memory-ai/` that
# means English prose. The two findings this allowlist exists for are:
#
#   docs/memory-ai/interface/cfg-api.md:13
#     "> `middleware/cfg` owns what a setting may be; it does not own where
#      the setting goes ..."
#
#   docs/memory-ai/memory.md:2293
#     the same sentence, in the generated single-read digest
#
# Both are sentences describing a module. Neither is a credential.
#
# **Scoped to this one rule, not to the whole directory.** Every other rule -
# AWS keys, GitHub tokens, private key blocks, all of them - still runs over
# these files. A real credential pasted into a doc is still caught; only the
# entropy heuristic is told to stop guessing at prose.
#
# **Scoped by path rather than by fingerprint on purpose.** A fingerprint is
# `commit:file:rule:line`, and `memory.md` is regenerated by
# `memory_docs.py digest` - every regeneration is a new commit with new line
# numbers, so a .gitleaksignore listing fingerprints would need a new entry
# after every bank sync. This does not.
[[allowlists]]
description = "English prose in the memory bank is not an API key"
targetRules = ["generic-api-key"]
paths = ['''^docs/memory-ai/.*\.md$''']
