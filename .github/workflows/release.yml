name: Release

# A tag is what makes a release real (R-VER-04). This workflow refuses to
# publish one that disagrees with VERSION or that has no changelog entry, so
# the three can never drift apart.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build 0xF001
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # R-VER-01: one source of truth. If the tag and VERSION disagree, one of
      # them is a typo and shipping either is worse than shipping neither.
      - name: Tag must match VERSION
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag_version  VERSION=$file_version"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ($file_version)"
            exit 1
          fi

      # Through tool-esp.py, like CI: the workspace path and the factory image
      # name live in the script, and `merge` takes that name from VERSION - which
      # the gate above has already proved equals the tag.
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python docs/scripts/tool-esp.py build
          python docs/scripts/tool-esp.py size | tee size-report.txt
          python docs/scripts/tool-esp.py merge

      - name: Collect the artifacts a field unit needs
        shell: bash
        run: |
          set -eu
          build="workspace/0xF001/build"
          mkdir -p dist

          # Provisioning a blank board. The name comes from VERSION via
          # `tool-esp.py merge`, and the tag gate above proved they agree.
          cp "$build/app-updater-${GITHUB_REF_NAME}-factory.bin" dist/
          cp "$build/bootloader/bootloader.bin"                  dist/
          cp "$build/partition_table/partition-table.bin"        dist/
          # v0.1.0 shipped without this and its own flash_args asked for it, so
          # the published set could not flash anything. Without ota_data the
          # bootloader has no slot selection to read.
          cp "$build/ota_data_initial.bin"                       dist/
          # flash_args names its files with the directories they sit in inside
          # build/. The assets are flat, so flatten the paths to match or the
          # @flash_args form resolves nothing.
          sed 's|bootloader/||; s|partition_table/||' \
            "$build/flash_args" > dist/flash_args

          # The OTA payload: what the updater downloads and writes to the other
          # slot. Deliberately not renamed - flash_args refers to it by name.
          cp "$build/app_updater.bin" dist/

          # Diagnosing a unit that is already in the field. The .elf is the only
          # thing that can turn a panic backtrace back into line numbers, and it
          # must be the exact one that produced the .bin.
          cp "$build/app_updater.elf" dist/
          cp "$build/app_updater.map" dist/

          # What this image was built from: the resolved config and the budget.
          cp workspace/0xF001/sdkconfig dist/
          cp size-report.txt            dist/

          # The OTA path checks the image it downloaded; publishing the digest
          # is what lets anyone else check it too.
          ( cd dist && sha256sum ./* > SHA256SUMS )
          ls -l dist

      # A release whose own flash_args names a file it does not ship is worse
      # than one with no flash_args, because it is only discovered at a bench.
      - name: Every file flash_args names must be present
        shell: bash
        run: |
          set -eu
          bad=0
          # Half of the v0.1.0 defect was a missing file; the other half was a
          # path. Both have to be checked, because a name that still carries its
          # build/ directory resolves to nothing among flat assets and the
          # basename check above would happily pass it.
          if grep -qE '^0x[0-9a-fA-F]+ +[^ ]*/' dist/flash_args; then
            echo "::error::flash_args still carries directory paths; the assets are flat"
            bad=1
          fi
          for f in $(grep -oE '[A-Za-z0-9._-]+\.bin' dist/flash_args); do
            if [ ! -f "dist/$f" ]; then
              echo "::error::flash_args names $f, which is not in dist/"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ]

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}
          path: dist

      # R-VER-05: the changelog entry is written the day the change is made, so
      # by release time the file already exists. No file means the release was
      # not prepared, and an unexplained binary is not a release.
      - name: Release notes must already exist
        shell: bash
        run: |
          notes="docs/CHANGELOG/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::missing $notes - move the [Unreleased] section into it first"
            exit 1
          fi
          echo "notes=$notes" >> "$GITHUB_ENV"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --verify-tag \
            dist/*
